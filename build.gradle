import com.android.build.gradle.internal.dsl.SigningConfig

buildscript {
    ext.nav_version = "2.9.8"
    ext.protobuf_version = '0.10.0'
    ext.compile_sdk = 37
    ext.min_sdk = 29
    ext.target_sdk = 34
    dependencies {
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_version"
        classpath "com.google.protobuf:protobuf-gradle-plugin:$protobuf_version"
        classpath libs.secretsGradleClasspath
    }
}

// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    alias(libs.plugins.androidApplication) apply false
    alias(libs.plugins.androidLibrary) apply false
    alias(libs.plugins.kotlinAndroid) apply false
    alias(libs.plugins.kotlinCompose) apply false
    alias(libs.plugins.ksp) apply false
    alias(libs.plugins.rikkaRefine) apply false
    alias(libs.plugins.secretsGradle) apply false
    alias(libs.plugins.androidBuiltInKotlin) apply false
}

def getKeystoreProperties() {
    def properties = new Properties()
    properties.setProperty("keyAlias", "")
    properties.setProperty("keyPassword", "")
    properties.setProperty("storeFile", "")
    properties.setProperty("storePassword", "")
    try {
        def propertiesFile = rootProject.file("keystore.properties")
        if (propertiesFile.exists()) {
            properties.load(new FileInputStream(propertiesFile))
        }
    } catch (Exception ignored) {
        properties = null
        println "Unable to read keystore"
    }
    return properties
}

ext {
    signingConfigs = {
        release {
            def keystore = getKeystoreProperties()
            // Skip when there is no keystore.properties (e.g. CI debug builds): Gradle 9
            // rejects file('')
            if (keystore != null && keystore.getProperty("storeFile")) {
                storeFile file(keystore.getProperty("storeFile"))
                storePassword keystore.getProperty("storePassword")
                keyAlias keystore.getProperty("keyAlias")
                keyPassword keystore.getProperty("keyPassword")
            }
        }
    }
    outputFileDir = "../../../../../apks"
}

tasks.register('clean', Delete) {
    delete "apks"
}
