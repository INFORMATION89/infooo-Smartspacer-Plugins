pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        mavenLocal()
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "Smartspacer Plugins"
include ':shared'
include ':systemstubs'
include ':uber'
include ':ubereats'
include ':transitgo'
include ':settings-ui'

project(':ubereats').projectDir = file('plugins/ubereats/app')
project(':transitgo').projectDir = file('plugins/transitgo/app')
