name: Release Uber Eats plugin

on:
  push:
    tags: ['ubereats-v*']

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-android-plugin.yml
    with:
      gradle_project: ":ubereats"
      version_file: "plugins/ubereats/app/build.gradle.kts"
      tag_prefix: "ubereats-v"
      apk_glob: "plugins/ubereats/app/build/outputs/apk/release/*.apk"
      asset_prefix: "uber-eats-smartspacer"
      asset_tag_mode: "full-tag"
      release_title: "Uber Eats for Smartspacer"
      release_notes: ".github/release-notes-ubereats.md"
      signing_mode: "environment"
      prerelease_policy: "zero-or-suffix"
    secrets: inherit
