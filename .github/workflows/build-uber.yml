# The root Build Plugins workflow builds all maintained applications on pushes and pull requests.
# Keep this workflow as a manual, focused build for the original Uber ride-tracking plugin.
name: Build original Uber plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :uber:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: uber-plugin
          path: apks/*.apk
          if-no-files-found: error
