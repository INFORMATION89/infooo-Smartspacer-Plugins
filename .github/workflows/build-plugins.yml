name: Build plugin suite

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'uber/src/**'
      - 'uber/build.gradle'
      - 'shared/src/**'
      - 'shared/build.gradle'
      - 'systemstubs/src/**'
      - 'systemstubs/build.gradle'
      - 'plugins/*/app/src/**'
      - 'plugins/*/app/build.gradle.kts'
      - 'plugins/*/app/proguard-rules.pro'
      - 'settings-ui/src/**'
      - 'settings-ui/build.gradle.kts'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'uber/src/**'
      - 'uber/build.gradle'
      - 'shared/src/**'
      - 'shared/build.gradle'
      - 'systemstubs/src/**'
      - 'systemstubs/build.gradle'
      - 'plugins/*/app/src/**'
      - 'plugins/*/app/build.gradle.kts'
      - 'plugins/*/app/proguard-rules.pro'
      - 'settings-ui/src/**'
      - 'settings-ui/build.gradle.kts'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :uber:testDebugUnitTest :ubereats:testDebugUnitTest :transitgo:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew :uber:lintRelease :ubereats:lintRelease :transitgo:lintRelease --stacktrace

      - name: Build all maintained plugins
        run: ./gradlew :uber:assembleDebug :ubereats:assembleRelease :transitgo:assembleRelease --stacktrace

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uber-rides-plugin
          path: apks/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uber-eats-plugin
          path: plugins/ubereats/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transit-go-plugin
          path: plugins/transitgo/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
