name: Release Uber plugin

on:
  push:
    tags: ['uber-v*']

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-android-plugin.yml
    with:
      gradle_project: ":uber"
      version_file: "uber/build.gradle"
      tag_prefix: "uber-v"
      apk_glob: "apks/uber-release.apk"
      asset_prefix: "uber-smartspacer"
      asset_tag_mode: "version-only"
      release_title: "Uber for Smartspacer (updated)"
      release_notes: ".github/release-notes-uber.md"
      signing_mode: "properties"
      prerelease_policy: "none"
    secrets: inherit
