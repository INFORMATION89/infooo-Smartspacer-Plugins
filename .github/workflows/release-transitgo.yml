name: Release Transit GO plugin

on:
  push:
    tags: ['transitgo-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          if [ -z "$SIGNING_PASSWORD" ]; then echo "::error::SIGNING_PASSWORD secret is missing"; exit 1; fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :transitgo:assembleRelease --stacktrace
          cp plugins/transitgo/app/build/outputs/apk/release/*.apk "transit-go-smartspacer-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          name: Transit GO for Smartspacer ${{ github.ref_name }}
          body_path: .github/release-notes-transitgo.md
          files: transit-go-smartspacer-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
