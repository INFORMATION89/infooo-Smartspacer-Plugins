name: Release Transit GO plugin

on:
  push:
    tags: ['transitgo-v*']

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-android-plugin.yml
    with:
      gradle_project: ":transitgo"
      version_file: "plugins/transitgo/app/build.gradle.kts"
      tag_prefix: "transitgo-v"
      apk_glob: "plugins/transitgo/app/build/outputs/apk/release/*.apk"
      asset_prefix: "transit-go-smartspacer"
      asset_tag_mode: "full-tag"
      release_title: "Transit GO for Smartspacer"
      release_notes: ".github/release-notes-transitgo.md"
      signing_mode: "environment"
      prerelease_policy: "suffix"
    secrets: inherit
